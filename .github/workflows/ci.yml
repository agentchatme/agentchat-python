name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: "Run the live smoke suite against api.agentchat.me"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 3 OSes × 3 Python versions because PyPI metadata claims "OS Independent"
  # and the realtime client uses asyncio (ProactorEventLoop on Windows vs
  # SelectorEventLoop on Linux/macOS). Cross-OS coverage catches event-loop
  # quirks before users do. Lint + type-check run on Linux only — they're
  # deterministic across OSes; running 3× would burn CI minutes for zero
  # signal.
  check:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: ubuntu-latest moved to 26.04 in
        # November 2026, where actions/setup-python has no 3.9 build.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: python -m ruff check src tests

      - name: Mypy
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: python -m mypy

      - name: Pytest
        run: python -m pytest -q

      # The conformance fixtures are the published contract's, byte for
      # byte: the checked-in manifest must equal the one agentchat.me
      # serves. A separate step on purpose: the test suite runs under a
      # network guard.
      - name: Conformance fixtures match the published contract
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13' }}
        run: |
          curl -fsSL --retry 3 https://agentchat.me/contract/v1/conformance/manifest.sha256 -o "$RUNNER_TEMP/published-manifest.sha256"
          diff -u "$RUNNER_TEMP/published-manifest.sha256" conformance/v1/manifest.sha256

  # Live smoke runs only on manual dispatch with run_live_smoke=true.
  # `AGENTCHAT_LIVE_API_KEY` must be set on the repo (Settings → Secrets).
  # Forks cannot read it. 3.12 only — one live hit per dispatch is plenty
  # to catch wire drift; matrix runs would just N-up the same network call.
  live-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_smoke }}
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Live smoke against api.agentchat.me
        env:
          AGENTCHAT_LIVE_API_KEY: ${{ secrets.AGENTCHAT_LIVE_API_KEY }}
        run: |
          if [ -z "$AGENTCHAT_LIVE_API_KEY" ]; then
            echo "::error::AGENTCHAT_LIVE_API_KEY repo secret is not set — cannot run live smoke."
            exit 1
          fi
          python -m pytest -q tests/test_smoke_live.py

  # Secret scan of the new commits only: the pull request's range, or the
  # push's. The default gitleaks rules plus the AgentChat API key rule
  # (.gitleaks.toml).
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Checksum-pinned, cached: a download happens only on a cache miss
      # (.github/actions/install-pinned-binary).
      - uses: ./.github/actions/install-pinned-binary
        with:
          name: gitleaks
          version: 8.30.1
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          binary: gitleaks

      - name: Select commits to scan
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "range=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          # A new branch (all-zero before) or a manual dispatch (no before):
          # the head commit.
          elif [[ "$BEFORE_SHA" =~ ^0*$ ]]; then
            echo "range=${HEAD_SHA}^..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${BEFORE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan new commits for secrets
        run: >-
          gitleaks git
          --redact
          --no-banner
          --log-opts="${{ steps.commits.outputs.range }}"
          .
