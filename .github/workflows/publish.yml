name: Publish to PyPI

# Two ways to publish:
#
#   1. Push a tag matching `v*` (e.g. `v1.0.2`) on a commit on `main` →
#      publishes to PyPI. The `verify` job refuses the release unless the
#      tag is exactly `v` + the version in BOTH `pyproject.toml` and
#      `src/agentchatme/_version.py`, and the tagged commit is on `main`.
#
#   2. Manual `workflow_dispatch` with `target=test` → uploads to TestPyPI
#      for a dry-run install. Use before the first real publish, or whenever
#      the build pipeline itself has changed. `target=prod` publishes the
#      dispatched commit to PyPI; `verify` requires that commit to be on
#      `main` too.
#
# Actions are pinned to commits (the version is in the trailing comment) so
# an upstream change cannot alter a release step; bump them deliberately.
#
# Auth uses PyPI / TestPyPI Trusted Publishers (OIDC) — there is NO
# long-lived `PYPI_API_TOKEN` in repo secrets. Configure each environment
# (`pypi` and `testpypi`) at:
#   https://pypi.org/manage/account/publishing/
#   https://test.pypi.org/manage/account/publishing/
# bound to this repo + workflow filename + the matching GitHub environment.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        required: true
        default: test
        options: [test, prod]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse a release that would publish something other than what the tag
  # says, or a commit that never reached main.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag matches the package version; the commit is on main
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          pyproject = re.search(r'^version\s*=\s*"([^"]+)"', open("pyproject.toml", encoding="utf-8").read(), re.M)
          module = re.search(r'^VERSION\s*=\s*"([^"]+)"', open("src/agentchatme/_version.py", encoding="utf-8").read(), re.M)
          problems = []
          if not pyproject or not module:
              problems.append("could not read the version from pyproject.toml and src/agentchatme/_version.py")
          elif pyproject.group(1) != module.group(1):
              problems.append(f"pyproject.toml says {pyproject.group(1)} but _version.py says {module.group(1)}")
          if os.environ["EVENT"] == "push" and pyproject:
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != f"v{pyproject.group(1)}":
                  problems.append(f"tag {tag} does not match the package version {pyproject.group(1)} (expected v{pyproject.group(1)})")
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          PY
          if [ "$EVENT" = "push" ] || [ "$TARGET" = "prod" ]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_SHA is not on main; releases are cut from main only"
              exit 1
            fi
          fi
  # Re-run the full check matrix on the tagged commit. Don't trust prior
  # CI status — someone could tag a feature branch directly.
  test:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        # ubuntu-24.04, not ubuntu-latest: ubuntu-latest moved to 26.04 in
        # November 2026, where actions/setup-python has no 3.9 build.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: python -m ruff check src tests

      - name: Mypy
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: python -m mypy

      - name: Pytest
        run: python -m pytest -q

  # Optional pre-publish live smoke. Skips with success if the secret
  # isn't set (forks, fresh clones, TestPyPI dry-runs without the secret
  # should not block a legitimate publish).
  live-smoke:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Live smoke against api.agentchat.me
        env:
          AGENTCHAT_LIVE_API_KEY: ${{ secrets.AGENTCHAT_LIVE_API_KEY }}
        run: |
          if [ -z "$AGENTCHAT_LIVE_API_KEY" ]; then
            echo "::warning::AGENTCHAT_LIVE_API_KEY not set — skipping live smoke. Unit suite is the hard gate."
            exit 0
          fi
          python -m pytest -q tests/test_smoke_live.py

  build:
    runs-on: ubuntu-24.04
    needs: [test, live-smoke]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Show built artefacts
        run: ls -lh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'test' }}
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agentchatme
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  publish-pypi:
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod') }}
    environment:
      name: pypi
      url: https://pypi.org/p/agentchatme
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  # ─── Slack notifications (routing contract: core repo infra/monitoring/README.md) ───
  # awaiting-tap: fires after build succeeds, while the environment-gated
  # publish job sits waiting for the human approval — so the tap request
  # lives in Slack, not email. failure: any red job in the pipeline.
  # Both fail-safe: absent secret → logged warning, exit 0.
  notify-awaiting-tap:
    runs-on: ubuntu-24.04
    needs: build
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod')
    steps:
      - name: Post to Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_WARNING }}
          TEXT: ":hourglass_flowing_sand: *agentchatme (PyPI) release awaiting your approval* (`${{ github.ref_name }}` → pypi gate). Tap it here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::SLACK_WEBHOOK_WARNING not set — skipped"; exit 0; fi
          printf '%s' "$TEXT" | jq -Rs '{text: .}' | curl -sS -o /dev/null --max-time 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true

  notify-failure:
    runs-on: ubuntu-24.04
    needs: [verify, test, build, publish-testpypi, publish-pypi]
    if: failure()
    steps:
      - name: Post to Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_WARNING }}
          TEXT: ":warning: *agentchatme (PyPI) publish pipeline failed* on `${{ github.ref_name }}` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::SLACK_WEBHOOK_WARNING not set — skipped"; exit 0; fi
          printf '%s' "$TEXT" | jq -Rs '{text: .}' | curl -sS -o /dev/null --max-time 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true
